<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">出境火车票多跳检索 Agent 架构</title>
  <desc id="desc">问题经 Query Router 分流到单跳 Hybrid RAG、多文档并行合成或 Planner Executor Evidence Registry Verifier 多跳闭环，最终生成带引用回答，证据不足时拒答。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#18233c" flood-opacity=".07"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8290a8"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#fbfaf6"/></linearGradient>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="68" font-family="Inter, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#172036">出境火车票多跳检索 Agent · LangGraph 控制闭环</text>
  <text x="64" y="101" font-family="Inter, PingFang SC, sans-serif" font-size="15" fill="#667085">固定控制节点，动态决定子问题、检索方式与是否继续</text>

  <g fill="none" stroke="#8290a8" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M204 335 H270"/>
    <path d="M458 300 C520 230 552 202 616 190"/>
    <path d="M458 335 H616"/>
    <path d="M458 370 C520 440 552 462 616 476"/>
    <path d="M804 190 H1060 V276"/>
    <path d="M804 335 H1060 V306"/>
    <path d="M760 476 H810"/><path d="M934 476 H980"/><path d="M1104 476 H1142"/>
    <path d="M1204 428 V364 H1122"/>
    <path d="M1204 524 V590 H1086"/>
    <path d="M1170 476 C1112 636 820 650 734 524"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, PingFang SC, sans-serif">
    <g><rect x="64" y="286" width="140" height="98" rx="17" fill="#fff" stroke="#d8deea"/><text x="134" y="328" text-anchor="middle" font-size="17" font-weight="700" fill="#172036">Question</text><text x="134" y="356" text-anchor="middle" font-size="13" fill="#667085">文档问答</text></g>
    <g><rect x="270" y="274" width="188" height="122" rx="18" fill="#fff" stroke="#cfd8f8"/><rect x="270" y="274" width="8" height="122" rx="4" fill="#2d5bff"/><text x="364" y="324" text-anchor="middle" font-size="18" font-weight="700" fill="#172036">Query Router</text><text x="364" y="355" text-anchor="middle" font-size="13" fill="#667085">只让条件依赖题进入多跳</text></g>

    <g><rect x="616" y="146" width="188" height="88" rx="17" fill="#fff" stroke="#cfe8e5"/><text x="710" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#172036">Single-shot Hybrid RAG</text><text x="710" y="208" text-anchor="middle" font-size="13" fill="#667085">single-hop</text></g>
    <g><rect x="616" y="291" width="188" height="88" rx="17" fill="#fff" stroke="#e5d9c7"/><text x="710" y="327" text-anchor="middle" font-size="16" font-weight="700" fill="#172036">Parallel Retrieval</text><text x="710" y="353" text-anchor="middle" font-size="13" fill="#667085">multi-source synthesis</text></g>

    <g><rect x="616" y="432" width="144" height="88" rx="17" fill="#fff" stroke="#cfd8f8"/><text x="688" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#172036">Planner</text><text x="688" y="497" text-anchor="middle" font-size="13" fill="#667085">最小一步</text></g>
    <g><rect x="810" y="432" width="124" height="88" rx="17" fill="#fff" stroke="#d8deea"/><text x="872" y="484" text-anchor="middle" font-size="16" font-weight="700" fill="#172036">Executor</text></g>
    <g><rect x="980" y="432" width="124" height="88" rx="17" fill="#fff" stroke="#d8deea"/><text x="1042" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#172036">Evidence</text><text x="1042" y="495" text-anchor="middle" font-size="15" font-weight="700" fill="#172036">Registry</text></g>
    <g><rect x="1142" y="428" width="124" height="96" rx="17" fill="#fff" stroke="#e3d2cf"/><rect x="1142" y="428" width="8" height="96" rx="4" fill="#bd5f55"/><text x="1204" y="470" text-anchor="middle" font-size="16" font-weight="700" fill="#172036">Verifier</text><text x="1204" y="497" text-anchor="middle" font-size="13" fill="#667085">PASS / REPLAN</text></g>

    <g><rect x="1060" y="264" width="176" height="98" rx="18" fill="#fff" stroke="#cfe8e5"/><rect x="1060" y="264" width="8" height="98" rx="4" fill="#0f857b"/><text x="1148" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#172036">Cited Answer</text><text x="1148" y="334" text-anchor="middle" font-size="13" fill="#667085">逐 Claim 引用</text></g>
    <g><rect x="910" y="568" width="176" height="84" rx="17" fill="#fff" stroke="#e5d9c7"/><text x="998" y="603" text-anchor="middle" font-size="15" font-weight="700" fill="#172036">Evidence Gap / Conflict</text><text x="998" y="629" text-anchor="middle" font-size="13" fill="#667085">ABSTAIN</text></g>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">
    <text x="520" y="206" fill="#0f857b">SINGLE_HOP</text><text x="516" y="326" fill="#b96b17">MULTI_SOURCE</text><text x="505" y="456" fill="#2d5bff">AGENTIC_MULTI_HOP</text>
    <text x="1068" y="552" fill="#2d5bff">REPLAN · missing but reachable</text><text x="1134" y="401" fill="#0f857b">PASS</text><text x="1108" y="622" fill="#b96b17">ABSTAIN</text>
  </g>
</svg>
