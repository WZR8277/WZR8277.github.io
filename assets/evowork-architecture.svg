<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">EvoWork 六层架构与领域只读边界</title>
  <desc id="desc">交互与任务层依次连接 Agent 推理与状态门控、Runtime 与工具调度、领域只读扩展；领域扩展连接 C 端订单只读源、中台统一状态接口、C 端日志查询接口，以及 Context、Memory、Artifact 与 Eval、Safety、Trajectory 治理。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18233c" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8290a8"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#f7fbfa"/></linearGradient>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="68" font-family="Inter, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#172036">EvoWork · 六层架构与只读领域边界</text>
  <text x="64" y="101" font-family="Inter, PingFang SC, sans-serif" font-size="15" fill="#667085">项目文档架构 · Runtime / Memory / Skills / Eval / Safety</text>

  <g fill="none" stroke="#8290a8" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M264 236 H340"/><path d="M556 236 H632"/><path d="M848 236 H924"/>
    <path d="M1032 300 V372 H830 V409"/>
    <path d="M722 482 H636"/>
    <path d="M1032 300 V366 H1000 V409"/>
    <path d="M1032 300 V366 H1170 V409"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, PingFang SC, sans-serif">
    <g><rect x="64" y="174" width="200" height="124" rx="18" fill="#fff" stroke="#cfd8f8"/><rect x="64" y="174" width="8" height="124" rx="4" fill="#2d5bff"/><text x="92" y="224" font-size="18" font-weight="700" fill="#172036">交互与任务层</text><text x="92" y="256" font-size="14" fill="#667085">任务输入 · 状态呈现</text></g>
    <g><rect x="340" y="174" width="216" height="124" rx="18" fill="#fff" stroke="#cfe8e5"/><rect x="340" y="174" width="8" height="124" rx="4" fill="#0f857b"/><text x="368" y="218" font-size="18" font-weight="700" fill="#172036">Agent 推理</text><text x="368" y="246" font-size="18" font-weight="700" fill="#172036">与状态门控层</text><text x="368" y="274" font-size="14" fill="#667085">选择 · 继续 · 停止</text></g>
    <g><rect x="632" y="174" width="216" height="124" rx="18" fill="#fff" stroke="#e5d9c7"/><rect x="632" y="174" width="8" height="124" rx="4" fill="#b96b17"/><text x="660" y="218" font-size="18" font-weight="700" fill="#172036">Runtime</text><text x="660" y="246" font-size="18" font-weight="700" fill="#172036">与工具调度层</text><text x="660" y="274" font-size="14" fill="#667085">Dispatch · Batch · Interrupt</text></g>
    <g><rect x="924" y="174" width="216" height="124" rx="18" fill="#fff" stroke="#e3d2cf"/><rect x="924" y="174" width="8" height="124" rx="4" fill="#bd5f55"/><text x="952" y="218" font-size="18" font-weight="700" fill="#172036">领域只读扩展层</text><text x="952" y="250" font-size="14" fill="#667085">授权 Handler</text><text x="952" y="274" font-size="14" fill="#667085">不执行生产写操作</text></g>

    <g><rect x="402" y="409" width="234" height="126" rx="18" fill="#fff" stroke="#cfd8f8"/><rect x="402" y="409" width="8" height="126" rx="4" fill="#2d5bff"/><text x="430" y="455" font-size="18" font-weight="700" fill="#172036">Context · Memory</text><text x="430" y="483" font-size="18" font-weight="700" fill="#172036">· Artifact 层</text><text x="430" y="511" font-size="14" fill="#667085">外部化 · 选择 · 压缩 · 隔离</text></g>
    <g><rect x="722" y="409" width="236" height="126" rx="18" fill="#fff" stroke="#cfe8e5"/><rect x="722" y="409" width="8" height="126" rx="4" fill="#0f857b"/><text x="750" y="455" font-size="18" font-weight="700" fill="#172036">Eval · Safety</text><text x="750" y="483" font-size="18" font-weight="700" fill="#172036">· Trajectory 治理层</text><text x="750" y="511" font-size="14" fill="#667085">回归门控 · 权限 · 审计</text></g>

    <g><rect x="976" y="409" width="146" height="94" rx="16" fill="#fff" stroke="#dce1ea"/><text x="1049" y="447" text-anchor="middle" font-size="15" font-weight="700" fill="#172036">C 端订单</text><text x="1049" y="474" text-anchor="middle" font-size="14" fill="#667085">只读源</text></g>
    <g><rect x="1134" y="409" width="146" height="94" rx="16" fill="#fff" stroke="#dce1ea"/><text x="1207" y="447" text-anchor="middle" font-size="15" font-weight="700" fill="#172036">中台统一状态</text><text x="1207" y="474" text-anchor="middle" font-size="14" fill="#667085">只读接口</text></g>
    <g><rect x="976" y="523" width="304" height="82" rx="16" fill="#fff" stroke="#dce1ea"/><text x="1128" y="557" text-anchor="middle" font-size="15" font-weight="700" fill="#172036">C 端日志查询接口</text><text x="1128" y="584" text-anchor="middle" font-size="14" fill="#667085">状态矛盾或部分完成时按需取证</text></g>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">
    <rect x="64" y="628" width="112" height="36" rx="18" fill="#eef2ff"/><text x="120" y="651" text-anchor="middle" fill="#2d5bff">Runtime</text>
    <rect x="188" y="628" width="104" height="36" rx="18" fill="#edf8f6"/><text x="240" y="651" text-anchor="middle" fill="#0f857b">Memory</text>
    <rect x="304" y="628" width="104" height="36" rx="18" fill="#fff6e9"/><text x="356" y="651" text-anchor="middle" fill="#b96b17">Skills</text>
    <rect x="420" y="628" width="88" height="36" rx="18" fill="#fff2ef"/><text x="464" y="651" text-anchor="middle" fill="#bd5f55">Eval</text>
    <rect x="520" y="628" width="104" height="36" rx="18" fill="#f1f3f6"/><text x="572" y="651" text-anchor="middle" fill="#596273">Safety</text>
  </g>
</svg>
